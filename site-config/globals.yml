---


# network config
kolla_internal_vip_address: 172.16.201.254
kolla_external_vip_address: "{{ kolla_internal_vip_address }}"

# enable federated  login:

enable_keystone_federation: true
keystone_idp_client_id: keystone-ciab-dev
keystone_idp_client_secret: public

keystone_identity_providers:
  - name: "chameleon"
    openstack_domain: "chameleon"
    protocol: openid
    identifier: "https://auth.chameleoncloud.org/auth/realms/chameleon"
    public_name: Login with Chameleon
    attribute_mapping: chameleon_mapping
    metadata_folder: "{{ node_custom_config }}/keystone/federation/metadata"
  - name: "chameleon_dev"
    openstack_domain: "chameleon_dev"
    protocol: openid
    identifier: "https://auth.dev.chameleoncloud.org/auth/realms/chameleon"
    public_name: Login with Chameleon Dev
    attribute_mapping: chameleon_mapping
    metadata_folder: "{{ node_custom_config }}/keystone/federation/metadata"

keystone_identity_mappings:
  - name: chameleon_mapping
    file: "{{ node_custom_config }}/keystone/idp_mapping.json"

# keystone_federation_oidc_jwks_uri: "https://<AUTH PROVIDER>/<ID>/discovery/v2.0/keys"
# keystone_federation_oidc_additional_options:
#   OIDCTokenBindingPolicy: disabled


enable_blazar: true
blazar_enable_host_reservation: false
blazar_enable_flavor_reservation: true


#keystone_image_full: ghcr.io/chameleoncloud/kolla/keystone:2023.1-ubuntu-jammy
keystone_tag: a42b38d-dirty # for federated login
horizon_tag: a42b38d-dirty  # added flavor reservation + merge
blazar_tag: a42b38d-dirty  # added flavor resrvation + merge
nova_tag: a42b38d-dirty # to add blazar filter

# dev mode toggles
kolla_dev_repos_git: https://github.com/chameleoncloud

  #keystone_logging_debug: true
  #keystone_dev_mode: true
  #keystone_source_version: chameleoncloud/2023.1

  #horizon_logging_debug: true
  #horizon_dev_mode: true
  #horizon_source_version: chameleoncloud/2023.1-kvm
  #horizon_blazar_dev_mode: true
  #horizon_blazar_source_version: chameleoncloud/2023.1-kvm

  #blazar_logging_debug: true
  #blazar_dev_mode: true
  #blazar_source_version: chameleoncloud/2023.1-kvm
