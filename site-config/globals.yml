---
#########################
# Deploy Host Config Vars
#########################
# The directory on the deploy host containing globals.yml.
# this is also the base of our of our site config dir
# CONFIG_DIR is set by --configdir
node_config: "{{ CONFIG_DIR }}"
# The directory to merge custom config files the kolla's config files
node_custom_config: "{{ CONFIG_DIR }}/node_custom_config"

#########################
# Target host config vars
#########################
# The directory to store the config files on the destination node
node_config_directory: "/opt/kolla/config"  
# where bootstrap-serves will create virtualenv on target hosts
virtualenv: /opt/kolla/venv

# The group which own node_config_directory, you can use a non-root
# user to deploy kolla
# create_kolla_user: true
# config_owner_user: "kolla"
# config_owner_group: "kolla"

# target virtualenv directory and python interpreter
# this is set in group_vars as it varies per host
#ansible_python_interpreter: /opt/kolla/venv/bin/python

####################
# Global config vars
####################

kolla_base_distro: "ubuntu"
kolla_install_type: "source"



# default superadmin user and project
keystone_admin_user: "admin"
keystone_admin_project: "openstack"

# for kvm on kvm
nova_compute_virt_type: kvm

####################################
# Horizon config for chameleon theme
####################################

chameleon_portal_url: https://www.chameleoncloud.org
chameleon_reference_api_url: https://api.chameleoncloud.org

chameleon_site_name: "{{ openstack_region_name }}"

# Whether to show a dropdown in the Horizon GUI that provides links to other
# Chameleon testbed sites.
enable_chameleon_multisite: yes

horizon_help_url: https://www.chameleoncloud.org/user/help/
horizon_documentation_url: https://chameleoncloud.readthedocs.io/en/latest/technical/gui.html

# as of antelope/2023.1, can load theme at deploy-time
horizon_custom_themes:
  - name: chameleoncloud
    label: ChameleonCloud

########################
# Federated login config
########################

enable_keystone_federation: true

keystone_identity_providers:
  - name: "chameleon_dev"
    openstack_domain: "chameleon_dev"
    protocol: openid
    identifier: "https://auth.dev.chameleoncloud.org/auth/realms/chameleon"
    public_name: Login with Chameleon Dev
    attribute_mapping: chameleon_mapping

keystone_identity_mappings:
  - name: chameleon_mapping
    file: "{{ node_custom_config }}/keystone/idp_mapping.json"

keystone_oidc_client_id: "keystone-ciab-dev"
keystone_oidc_client_secret: "public"
keystone_oidc_provider_metadata_url: "{{ keystone_identity_providers[0].identifier }}/.well-known/openid-configuration"

# keystone must support mapping multiple projects or keycloak federation will fail
keystone_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-keystone:e193d13
keystone_fernet_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-keystone-fernet:e193d13
keystone_ssh_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-keystone-ssh:e193d13
horizon_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-horizon:e193d13

#################
# CHI@Edge config
#################

enable_nova: false

# enable zun, but use compute_k8s backend
enable_zun: true
enable_zun_compute: false
enable_zun_compute_k8s: true
zun_api_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-zun-api:xena-edge
zun_wsproxy_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-zun-wsproxy:xena-edge
zun_compute_k8s_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-zun-compute-k8s:xena-edge

# deploy a k3s server on control nodes
enable_k3s: true
k3s_image_full: ghcr.io/chameleoncloud/kolla/ubuntu-source-k3s:xena-edge
