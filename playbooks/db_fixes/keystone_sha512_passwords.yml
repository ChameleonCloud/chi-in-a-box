---
- hosts: control
  run_once: true
  become: true
  vars:
    # A deploy already re-sets the kolla service users; these it doesn't.
    known_passwords:
      admin: "{{ keystone_admin_password }}"
      heat_domain_admin: "{{ heat_domain_admin_password }}"
      instance_metrics_writer: "{{ instance_metrics_writer_password }}"
  tasks:
    - name: find users whose password is hashed with sha512_crypt
      kolla_toolbox:
        container_engine: "{{ kolla_container_engine }}"
        module_name: community.mysql.mysql_query
        module_args:
          login_host: "{{ database_address }}"
          login_port: "{{ database_port }}"
          login_user: keystone
          login_password: "{{ keystone_database_password }}"
          login_db: keystone
          query: >-
            SELECT lu.name, lu.domain_id FROM local_user lu
            JOIN password p ON p.local_user_id = lu.id
            WHERE p.password_hash LIKE '$6$%'
            AND p.created_at_int =
            (SELECT MAX(created_at_int) FROM password WHERE local_user_id = lu.id)
      register: sha512

    - name: set known passwords again, so keystone re-hashes them
      kolla_toolbox:
        container_engine: "{{ kolla_container_engine }}"
        module_name: openstack.cloud.identity_user
        module_args:
          auth: "{{ openstack_auth }}"
          name: "{{ item.name }}"
          domain: "{{ item.domain_id }}"
          password: "{{ known_passwords[item.name] }}"
          update_password: always
      loop: "{{ sha512.query_result[0] }}"
      when: item.name in known_passwords
      no_log: true

    - name: list users to fix by hand
      ansible.builtin.fail:
        msg: >-
          {{ item.name }}: run ./cc-ansible reconfigure if it's a kolla
          service user; otherwise re-set its password, ask its owner to log
          in, or disable it.
      loop: "{{ sha512.query_result[0] }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in known_passwords
