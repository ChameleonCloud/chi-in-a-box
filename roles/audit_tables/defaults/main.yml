---

audit_blazar_computehosts: false
audit_blazar_computehost_extra_capabilities: "{{ audit_blazar_computehosts }}"
audit_blazar_extra_capabilities: "{{ audit_blazar_computehosts }}"

audit_blazar_devices: false
audit_blazar_device_extra_capabilities: "{{ audit_blazar_devices }}"

audit_zun_containers: false
audit_zun_container_actions: "{{ audit_zun_containers }}"
audit_zun_container_actions_events: "{{ audit_zun_containers }}"
audit_zun_compute_nodes: false
audit_zun_services: "{{ audit_zun_compute_nodes }}"

audit_tables:
  - name: blazar_computehosts
    source_db: blazar
    source_table: computehosts
    grant_user: blazar
    id_type: "VARCHAR(36)"
    enabled: "{{ audit_blazar_computehosts }}"
    columns:
      - id
      - hypervisor_hostname
      - vcpus
      - memory_mb
      - local_gb
      - status
      - reservable
      - disabled
      - created_at
      - deleted_at
    watch_columns:
      - status
      - reservable
      - disabled
  - name: blazar_computehost_extra_capabilities
    source_db: blazar
    source_table: computehost_extra_capabilities
    grant_user: blazar
    id_type: "VARCHAR(36)"
    enabled: "{{ audit_blazar_computehost_extra_capabilities }}"
    columns:
      - created_at
      - updated_at
      - id
      - computehost_id
      - capability_id
      - capability_value
      - deleted
      - deleted_at
    watch_columns:
      - capability_value
  - name: blazar_extra_capabilities
    source_db: blazar
    source_table: extra_capabilities
    grant_user: blazar
    id_type: "VARCHAR(36)"
    enabled: "{{ audit_blazar_extra_capabilities }}"
    columns:
      - created_at
      - updated_at
      - id
      - resource_type
      - capability_name
      - private
      - deleted
      - deleted_at
    watch_columns:
      - capability_name
      - private
  - name: blazar_devices
    source_db: blazar
    source_table: devices
    grant_user: blazar
    id_type: "VARCHAR(36)"
    enabled: "{{ audit_blazar_devices }}"
    columns:
      - created_at
      - updated_at
      - id
      - name
      - device_type
      - device_driver
      - reservable
      - deleted
      - deleted_at
    watch_columns:
      - name
      - device_type
      - device_driver
      - reservable
  - name: blazar_device_extra_capabilities
    source_db: blazar
    source_table: device_extra_capabilities
    grant_user: blazar
    id_type: "VARCHAR(36)"
    enabled: "{{ audit_blazar_device_extra_capabilities }}"
    columns:
      - created_at
      - updated_at
      - id
      - device_id
      - capability_id
      - capability_value
      - deleted
      - deleted_at
    watch_columns:
      - capability_value
  - name: zun_containers
    source_db: zun
    source_table: container
    grant_user: zun
    id_type: "INT(11)"
    enabled: "{{ audit_zun_containers }}"
    columns:
      - created_at
      - updated_at
      - id
      - project_id
      - user_id
      - uuid
      - name
      - image
      - command
      - status
      - environment
      - container_id
      - memory
      - task_state
      - cpu
      - workdir
      - ports
      - hostname
      - labels
      - status_reason
      - image_pull_policy
      - addresses
      - host
      - restart_policy
      - status_detail
      - image_driver
      - interactive
      - websocket_url
      - security_groups
      - auto_remove
      - runtime
      - disk
      - auto_heal
      - capsule_id
      - started_at
      - privileged
      - healthcheck
      - exposed_ports
      - cpu_policy
      - cpuset
      - registry_id
      - container_type
      - tty
      - annotations
      - cni_metadata
      - entrypoint
    watch_columns:
      - status
      - task_state
      - status_reason
      - status_detail
      - started_at
      - host
  - name: zun_container_actions
    source_db: zun
    source_table: container_actions
    grant_user: zun
    id_type: "INT(11)"
    enabled: "{{ audit_zun_container_actions }}"
    columns:
      - created_at
      - updated_at
      - id
      - action
      - container_uuid
      - request_id
      - user_id
      - project_id
      - start_time
      - finish_time
      - message
    watch_columns:
      - finish_time
      - message
  - name: zun_container_actions_events
    source_db: zun
    source_table: container_actions_events
    grant_user: zun
    id_type: "INT(11)"
    enabled: "{{ audit_zun_container_actions_events }}"
    columns:
      - created_at
      - updated_at
      - id
      - event
      - action_id
      - start_time
      - finish_time
      - result
      - traceback
      - details
    watch_columns:
      - finish_time
      - result
  - name: zun_compute_nodes
    source_db: zun
    source_table: compute_node
    grant_user: zun
    id_type: "VARCHAR(36)"
    id_column: uuid
    enabled: "{{ audit_zun_compute_nodes }}"
    columns:
      - created_at
      - updated_at
      - uuid
      - hostname
      - mem_total
      - mem_free
      - mem_available
      - total_containers
      - running_containers
      - paused_containers
      - stopped_containers
      - cpus
      - cpu_used
      - architecture
      - os_type
      - os
      - kernel_version
      - mem_used
      - disk_total
      - disk_used
      - disk_quota_supported
      - enable_cpu_pinning
      - rp_uuid
    watch_columns:
      - hostname
      - cpus
      - mem_total
      - disk_total
  - name: zun_services
    source_db: zun
    source_table: zun_service
    grant_user: zun
    id_type: "INT(11)"
    enabled: "{{ audit_zun_services }}"
    columns:
      - created_at
      - updated_at
      - id
      - report_count
      - host
      - binary
      - disabled
      - disabled_reason
      - last_seen_up
      - forced_down
      - availability_zone
    watch_columns:
      - host
      - binary
      - disabled
      - disabled_reason
      - forced_down
