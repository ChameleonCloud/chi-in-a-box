---
# Public network and subnet
- name: Configure public network
  include_tasks: create_network.yml
  vars:
    network_name: "{{ public_network_name }}"
    network_args:
      project: "{{ keystone_admin_project }}"
      provider_network_type: flat
      provider_physical_network: public
      external: yes
  when: public_network_enabled

- name: Resolve public subnet parameters
  set_fact:
    _public_pools: "{{ (_public_raw.allocation_pools | default([{}]))[0] }}"
    _public_gateway_ip: "{{ _public_raw.gateway_ip | default(public_network_cidr | ipaddr('last_usable')) }}"
  when: public_network_enabled

- name: Resolve public allocation pools
  set_fact:
    _public_pool_start: "{{ _public_pools.start | default(public_network_cidr | next_nth_usable(2)) }}"
    _public_pool_end: "{{ _public_pools.end | default(public_network_cidr | ipaddr('last_usable') | ipmath(-1)) }}"
  when: public_network_enabled

- name: Configure public subnet
  include_tasks: create_subnet.yml
  vars:
    subnet_name: "{{ public_network_name }}-subnet"
    subnet_args:
      project: "{{ keystone_admin_project }}"
      network_name: "{{ public_network_name }}"
      cidr: "{{ public_network_cidr }}"
      enable_dhcp: false
      gateway_ip: "{{ _public_gateway_ip }}"
      allocation_pool_start: "{{ _public_pool_start }}"
      allocation_pool_end: "{{ _public_pool_end }}"
  when: public_network_enabled

# Shared tenant network, subnet, and NAT router
- name: Configure shared network
  include_tasks: create_network.yml
  vars:
    network_name: "{{ shared_network_name }}"
    network_args:
      project: "{{ keystone_admin_project }}"
      provider_network_type: "{{ shared_network_type }}"
      provider_physical_network: "{{ '' if shared_network_type == 'vxlan' else shared_network_physical_network }}"
      provider_segmentation_id: "{{ shared_network_segmentation_id }}"
      shared: yes
  when: shared_network_enabled

- name: Resolve shared subnet parameters
  set_fact:
    _sharednet_pools: "{{ (_sharednet_config.allocation_pools | default([{}]))[0] }}"
  when: shared_network_enabled

- name: Resolve shared allocation pools
  set_fact:
    _sharednet_pool_start: "{{ _sharednet_pools.start | default(shared_network_cidr | next_nth_usable(2)) }}"
    _sharednet_pool_end: "{{ _sharednet_pools.end | default(shared_network_cidr | ipaddr('last_usable') | ipmath(-1)) }}"
  when: shared_network_enabled

- name: Configure shared network subnet
  include_tasks: create_subnet.yml
  vars:
    subnet_name: "{{ shared_network_name }}-subnet"
    subnet_args:
      project: "{{ keystone_admin_project }}"
      network_name: "{{ shared_network_name }}"
      cidr: "{{ shared_network_cidr }}"
      allocation_pool_start: "{{ _sharednet_pool_start }}"
      allocation_pool_end: "{{ _sharednet_pool_end }}"
  when: shared_network_enabled

- name: Configure NAT router for shared network
  include_tasks: create_router.yml
  vars:
    router_name: sharednet-router
    router_args:
      project: "{{ keystone_admin_project }}"
      interfaces:
        - "{{ shared_network_name }}-subnet"
      network: "{{ public_network_name }}"
      external_fixed_ips:
        - subnet: "{{ public_network_name }}-subnet"
  when:
    - shared_network_enabled
    - public_network_enabled

# Clean up corsa NAT hook if present
- name: Remove corsa NAT hook
  become: True
  ansible.builtin.file:
    path: /etc/networkd-dispatcher/routable.d/50-corsa-nat.sh
    state: absent
