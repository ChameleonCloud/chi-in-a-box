---
# Public network and subnet
- name: Configure public network
  include_tasks: create_network.yml
  vars:
    network_name: "{{ public_network.name }}"
    network_args:
      project: "{{ keystone_admin_project }}"
      provider_network_type: "{{ public_network.provider_network_type }}"
      provider_physical_network: "{{ public_network.provider_physical_network }}"
      provider_segmentation_id: "{{ public_network.provider_segmentation_id }}"
      external: "{{ public_network.external }}"
      shared: "{{ public_network.shared }}"
  when: public_network.enabled

- name: Configure public subnet
  include_tasks: create_subnet.yml
  vars:
    subnet_name: "{{ public_network.name }}-subnet"
    subnet_args:
      project: "{{ keystone_admin_project }}"
      network_name: "{{ public_network.name }}"
      cidr: "{{ public_network.cidr }}"
      enable_dhcp: "{{ public_network.enable_dhcp }}"
      gateway_ip: "{{ public_network.gateway_ip }}"
      allocation_pool_start: "{{ public_network.allocation_pool_start }}"
      allocation_pool_end: "{{ public_network.allocation_pool_end }}"
  when: public_network.enabled

# Shared tenant network, subnet, and NAT router
- name: Configure shared network
  include_tasks: create_network.yml
  vars:
    network_name: "{{ shared_network.name }}"
    network_args:
      project: "{{ keystone_admin_project }}"
      provider_network_type: "{{ shared_network.provider_network_type }}"
      provider_physical_network: "{{ '' if shared_network.provider_network_type == 'vxlan' else shared_network.provider_physical_network }}"
      provider_segmentation_id: "{{ shared_network.provider_segmentation_id }}"
      external: "{{ shared_network.external }}"
      shared: "{{ shared_network.shared }}"
  when: shared_network.enabled

- name: Configure shared network subnet
  include_tasks: create_subnet.yml
  vars:
    subnet_name: "{{ shared_network.name }}-subnet"
    subnet_args:
      project: "{{ keystone_admin_project }}"
      network_name: "{{ shared_network.name }}"
      cidr: "{{ shared_network.cidr }}"
      enable_dhcp: "{{ shared_network.enable_dhcp }}"
      gateway_ip: "{{ shared_network.gateway_ip }}"
      allocation_pool_start: "{{ shared_network.allocation_pool_start }}"
      allocation_pool_end: "{{ shared_network.allocation_pool_end }}"
  when: shared_network.enabled

- name: Configure NAT router for shared network
  include_tasks: create_router.yml
  vars:
    router_name: sharednet-router
    router_args:
      project: "{{ keystone_admin_project }}"
      interfaces:
        - "{{ shared_network.name }}-subnet"
      network: "{{ public_network.name }}"
      external_fixed_ips:
        - subnet: "{{ public_network.name }}-subnet"
  when:
    - shared_network.enabled
    - public_network.enabled

# Clean up corsa NAT hook if present
- name: Remove corsa NAT hook
  become: True
  ansible.builtin.file:
    path: /etc/networkd-dispatcher/routable.d/50-corsa-nat.sh
    state: absent
