---
# Create a subnet if it doesn't already exist.
# Required vars:
#   subnet_name: name of the subnet
#   subnet_args: dict of args passed to os_subnet (excluding auth/state/name)
- name: "Check if subnet '{{ subnet_name }}' exists"
  become: true
  run_once: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.subnets_info
    module_args:
      auth: "{{ openstack_auth }}"
      name: "{{ subnet_name }}"
  register: _subnet_check

- name: "Create subnet '{{ subnet_name }}'"
  become: true
  run_once: true
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: os_subnet
    module_args: "{{ {'auth': openstack_auth, 'name': subnet_name, 'state': 'present'} | combine(subnet_args) }}"
  when: _subnet_check.subnets | length == 0

- name: "Subnet '{{ subnet_name }}' already exists, skipping"
  debug:
    msg: "Subnet '{{ subnet_name }}' already exists. To recreate, delete it manually first."
  when: _subnet_check.subnets | length > 0