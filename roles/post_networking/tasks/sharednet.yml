---
- name: Set fact for sharednet segmentation id
  set_fact:
    sharednet_segmentation_id: "{{ (shared_network.on_demand_vlan_ranges[0].split(':')[0] | int) + 1 }}"
  when:
    - shared_network.on_demand_vlan_ranges is defined
    - shared_network.on_demand_vlan_ranges | length > 0

- name: Check if shared network(s) exist
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.networks_info
    module_args:
      auth: "{{ openstack_auth }}"
      name: "{{ item.sharednet.name | default(default_sharednet_name) }}"
  loop: "{{ neutron_networks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  run_once: True
  register: _sharednet_checks
  when:
    - item.sharednet is defined

- name: Create shared network(s)
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: os_network
    module_args:
      auth: "{{ openstack_auth }}"
      project: "{{ keystone_admin_project }}"
      name: "{{ item.item.sharednet.name | default(default_sharednet_name) }}"
      provider_network_type: "{{ item.item.network_type | default('vlan') }}"
      # Use the first on-demand VLAN for this network.
      provider_segmentation_id: "{{ sharednet_segmentation_id | default(omit) }}"
      provider_physical_network: "{{ '' if (item.item.network_type | default('vlan')) == 'vxlan' else item.item.name }}"
      shared: yes
      state: present
  check_mode: "{{ (item.networks | default([])) | length > 0 }}"
  loop: "{{ _sharednet_checks.results }}"
  loop_control:
    label: "{{ item.item.name | default('skipped') }}"
  become: true
  run_once: True
  when:
    - item.item.sharednet is defined

- name: Check if shared network subnet(s) exist
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.subnets_info
    module_args:
      auth: "{{ openstack_auth }}"
      name: "{{ item.sharednet.name | default(default_sharednet_name) }}-subnet"
  loop: "{{ neutron_networks }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  run_once: True
  register: _sharednet_subnet_checks
  when:
    - item.sharednet is defined
    - item.sharednet.enabled | default(true) | bool

- name: Create shared network subnet(s)
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: os_subnet
    module_args:
      auth: "{{ openstack_auth }}"
      project: "{{ keystone_admin_project }}"
      network_name: "{{ item.item.sharednet.name | default(default_sharednet_name) }}"
      name: "{{ item.item.sharednet.name | default(default_sharednet_name) }}-subnet"
      cidr: "{{ cidr }}"
      allocation_pool_start: "{{ item.item.sharednet.allocation_pools[0].start | default(cidr | next_nth_usable(2)) }}"
      allocation_pool_end: "{{ item.item.sharednet.allocation_pools[0].end | default(cidr | ipaddr('last_usable') | ipmath(-1)) }}"
  vars:
    cidr: "{{ item.item.sharednet.cidr | default(default_sharednet_cidr) }}"
  check_mode: "{{ (item.subnets | default([])) | length > 0 }}"
  loop: "{{ _sharednet_subnet_checks.results }}"
  loop_control:
    label: "{{ item.item.name | default('skipped') }}"
  become: true
  run_once: True
  when:
    - item.item.sharednet is defined
    - item.item.sharednet.enabled | default(true) | bool
  register: sharednet_subnets

- name: Check if sharednet router exists
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: openstack.cloud.routers_info
    module_args:
      auth: "{{ openstack_auth }}"
      name: sharednet-router
  become: true
  run_once: True
  register: _sharednet_router
  when:
    - sharednet_subnets is defined
    - public_network is defined
    - public_network.name is defined
    - public_network.cidr is defined

- name: Create NAT router for shared network(s).
  kolla_toolbox:
    container_engine: "{{ kolla_container_engine }}"
    module_name: os_router
    module_args:
      auth: "{{ openstack_auth }}"
      project: "{{ keystone_admin_project }}"
      name: sharednet-router
      interfaces: "{{ sharednet_subnets.results | selectattr('subnet', 'defined') | map(attribute='subnet') | map(attribute='name') | list }}"
      network: "{{ public_network.name }}"
      external_fixed_ips:
        - subnet: "public-subnet"
  check_mode: "{{ (_sharednet_router.routers | default([])) | length > 0 }}"
  become: true
  run_once: True
  when:
    - sharednet_subnets is defined
    - public_network is defined
    - public_network.name is defined
    - public_network.cidr is defined
