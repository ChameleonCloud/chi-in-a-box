public_networks: "{{ neutron_networks | selectattr('public', 'defined') | list }}"
# This is added for backwards compatibility
named_public_networks: "{{ neutron_networks | selectattr('name', 'equalto', 'public') | list }}"
all_public_networks: "{{ public_networks + named_public_networks }}"
public_network: "{{ all_public_networks[0] if all_public_networks }}"

shared_networks: "{{ neutron_networks | selectattr('sharednet', 'defined') | list }}"
shared_network: "{{ shared_networks[0] if shared_networks }}"

default_sharednet_name: sharednet1
default_sharednet_cidr: 10.0.0.1/24

# Default to using the external VIP interface for NAT
corsa_nat_external_interface: "{{ kolla_external_vip_interface }}"

##############################################################################
# Edge networks: tunelo-calico (wireguard IPAM) + caliconet (container IPs)
##############################################################################

# tunelo-calico is a "shadow" neutron network used by tunelo as IPAM for
# wireguard tunnel endpoints. tunelo creates the hub port itself at startup;
# ansible only owns the network and subnet.
tunelo_calico_network_name: tunelo-calico
tunelo_calico_subnet_name: tunelo-calico-subnet
tunelo_calico_subnet_cidr: 10.0.3.0/24

# caliconet routes container (calico pod) IPs through neutron so they can be
# associated with floating IPs on the public network. No subnet is created
# unless caliconet_subnet_cidr is set in site config.
caliconet_network_name: caliconet
caliconet_subnet_name: caliconet-subnet
# caliconet_subnet_cidr: ""

# Admin router: caliconet-subnet attached as internal interface, public as
# external gateway. Required for floating-ip connectivity to k8s pods.
admin_router_name: admin-router
