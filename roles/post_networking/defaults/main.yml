# Extract raw entries from neutron_networks list of physnets
_public_by_attr: "{{ neutron_networks | selectattr('public', 'defined') | list }}"
_public_by_name: "{{ neutron_networks | selectattr('name', 'equalto', 'public') | list }}"
_public_raw: "{{ (_public_by_attr + _public_by_name)[0] | default({}) }}"

_sharednet_raw: "{{ (neutron_networks | selectattr('sharednet', 'defined') | list)[0] | default({}) }}"
_sharednet_config: "{{ _sharednet_raw.sharednet | default({}) }}"
_sharednet_vlan_ranges: "{{ _sharednet_raw.on_demand_vlan_ranges | default([]) }}"

# Public network
public_network_enabled: "{{ _public_raw.cidr is defined }}"
public_network_name: public
public_network_cidr: "{{ _public_raw.cidr | default(none) }}"

# Shared network
shared_network_enabled: "{{ _sharednet_config | length > 0 }}"
shared_network_name: "{{ _sharednet_config.name | default('sharednet1') }}"
shared_network_cidr: "{{ _sharednet_config.cidr | default('10.0.0.0/24') }}"
shared_network_type: "{{ _sharednet_raw.network_type | default('vlan') }}"
shared_network_physical_network: "{{ _sharednet_raw.name | default('physnet1') }}"
shared_network_segmentation_id: "{{ ((_sharednet_vlan_ranges[0].split(':')[0] | int) + 1) if _sharednet_vlan_ranges else omit }}"
