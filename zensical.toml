# Documentation site configuration. Build locally with:
#   pip install zensical && zensical serve
# See https://zensical.org/docs/ for available options.
#
# Published on Read the Docs. .readthedocs.yaml rewrites site_url and edit_uri
# for each version it builds, so the values here only apply to local and CI builds.

[project]
site_name = "CHI-in-a-Box"
site_description = "Deploy and operate a Chameleon testbed site"
site_url = "https://chi-in-a-box.readthedocs.io/en/latest/"
repo_url = "https://github.com/ChameleonCloud/chi-in-a-box"
repo_name = "ChameleonCloud/chi-in-a-box"
edit_uri = "edit/chameleoncloud/2025.1/docs/"
docs_dir = "docs"
extra_css = ["assets/stylesheets/extra.css"]

