---
name: CI for chi-in-a-box script

on:
  push:
    branches:
      - main
      - stable/*
  pull_request:
    branches:
      - main
      - stable/*
  workflow_dispatch: {}

jobs:
  ci:
    name: basic setup checks
    runs-on: 	[ ubuntu-22.04 ]
    steps:
      - name: checkout chi-in-a-box
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: run test script
        run: tests/setup_ciab.sh
