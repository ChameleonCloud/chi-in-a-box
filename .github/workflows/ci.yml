---
name: CI for chi-in-a-box script

on:
  push:
    branches:
      - stable/*
  pull_request:
    branches:
      - stable/*

jobs:
  test_edge:
    name: Run tests for edge
    runs-on: 	[ubuntu-22.04]
    env:
      CC_ANSIBLE_SITE: /opt/site-config
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: run test script
        run: tests/run.sh edge
